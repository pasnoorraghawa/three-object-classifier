<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Object Classifier</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
      background: #151515;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.15);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .classes {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .class-box {
      background: #222;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid #333;
    }

    button {
      background: #e50914;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ff1f2d;
    }

    #preview {
      margin: 30px auto 20px;
    }

    #preview img {
      max-width: 400px;
      max-height: 400px;
      border-radius: 15px;
      border: 2px solid #333;
    }

    .prediction {
      max-width: 600px;
      margin: 12px auto;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      text-align: left;
    }

    .prediction-name {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #e50914;
      border-radius: 10px;
    }

    .footer {
      margin-top: 30px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🤖 AI Object Classifier</h1>

  <p class="subtitle">
    Three-Class Image Classification Model
  </p>

  <div class="classes">
    <div class="class-box">📱 Mobile Phone</div>
    <div class="class-box">🧴 Water Bottle</div>
    <div class="class-box">🎧 Headphones</div>
  </div>

  <button onclick="document.getElementById('imageInput').click()">
    Upload Image
  </button>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none"
  >

  <div id="preview"></div>

  <div id="label-container"></div>

  <div class="footer">
    Trained with Google Teachable Machine • TensorFlow.js
  </div>

</div>

<script>

const MODEL_URL = "./";

let model;

async function loadModel() {

  model = await tmImage.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );

  console.log("Model loaded successfully!");
}

document
  .getElementById("imageInput")
  .addEventListener("change", async function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (!model) {
      await loadModel();
    }

    const image = document.createElement("img");

    image.src = URL.createObjectURL(file);

    image.onload = async function() {

      const preview = document.getElementById("preview");

      preview.innerHTML = "";
      preview.appendChild(image);

      const predictions = await model.predict(image);

      predictions.sort(
        (a, b) => b.probability - a.probability
      );

      const container =
        document.getElementById("label-container");

      container.innerHTML = "";

      predictions.forEach(result => {

        const percentage =
          (result.probability * 100).toFixed(1);

        const div =
          document.createElement("div");

        div.className = "prediction";

        div.innerHTML = `
          <div class="prediction-name">
            <strong>${result.className}</strong>
            <span>${percentage}%</span>
          </div>

          <div class="bar">
            <div
              class="fill"
              style="width:${percentage}%">
            </div>
          </div>
        `;

        container.appendChild(div);

      });

    };

  });

</script>

</body>
</html>
